name: Sync icons from Figma
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/export-figma.mjs
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
      - name: Commit changes
        id: commit
        run: |
          git config user.name "icons-sync"
          git config user.email "icons-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "changed=" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --cached --name-only > changed.txt
          git commit -m "Sync icons from Figma"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'yes'
        run: |
          REPO="${GITHUB_REPOSITORY}"
          for f in sprite.svg icons.json $(grep '^svg/' changed.txt | head -300); do
            curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/${f}" > /dev/null
          done
